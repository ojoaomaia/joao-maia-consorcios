# Painel do blog. Só entra quem tem acesso de escrita ao repositório no GitHub.
backend:
  name: github
  repo: ojoaomaia/joao-maia-consorcios
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  commit_messages:
    create: "Novo artigo: {{slug}}"
    update: "Atualiza artigo: {{slug}}"
    delete: "Remove artigo: {{slug}}"
    uploadMedia: "Envia imagem: {{path}}"
    deleteMedia: "Remove imagem: {{path}}"

locale: pt
logo_url: /favicon.svg
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
media_folder: public/img/blog
public_folder: /img/blog

collections:
  - name: blog
    label: Artigos do blog
    label_singular: Artigo
    description: >-
      Para criar uma matéria: clique em "+ Artigo", preencha de cima para baixo e acompanhe
      o "Checklist do Google" ao lado do texto. Quando tudo estiver verde, desligue
      "Guardar como rascunho" e clique em Publicar. O site atualiza sozinho em cerca de 1 minuto.
    folder: src/content/blog
    create: true
    slug: "{{fields.keyword}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: "Só rascunhos", field: draft, pattern: true }
      - { label: "Só publicados", field: draft, pattern: false }
    view_groups:
      - { label: "Categoria", field: category }
    preview_path: "blog/{{slug}}/"
    fields:
      - label: "1. Título do artigo"
        name: title
        widget: contador
        min: 10
        max: 110
        hint: "Como o leitor vê no topo do artigo. Use a palavra-chave. Ex.: Consórcio de caminhão: como funciona para autônomos"

      - label: "2. Palavra-chave principal"
        name: keyword
        widget: string
        hint: "O que a pessoa digita no Google. Ex.: consórcio de caminhão. Ela também vira o endereço do artigo (/blog/consorcio-de-caminhao/) e não muda depois de salvar."

      - label: "3. Categoria"
        name: category
        widget: select
        options:
          - { label: "Consórcio de imóvel", value: imovel }
          - { label: "Consórcio de veículo", value: veiculo }
          - { label: "Lance e contemplação", value: lance }
          - { label: "Consórcio x financiamento", value: comparativo }

      - label: "4. Resumo (aparece no Google e no card do blog)"
        name: summary
        widget: contador
        multiline: true
        min: 40
        max: 150
        hint: "Uma ou duas frases que fazem a pessoa clicar. Use a palavra-chave. Até 150 caracteres."

      - label: "5. Texto do artigo"
        name: body
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: [image]
        hint: "Use Subtítulo 2 (H2) para as partes principais e Subtítulo 3 (H3) para os detalhes. Parágrafos curtos. Nunca use travessão."
        default: |-
          Escreva aqui a introdução. Use a palavra-chave já na primeira frase e diga em poucas linhas o que a pessoa vai aprender.

          ## Primeiro subtítulo com a palavra-chave

          Explique a primeira parte. Parágrafos curtos, de 2 a 4 linhas.

          ## Segundo subtítulo

          - Use listas para passos e vantagens
          - Cada item com uma ideia só

          ## Terceiro subtítulo

          Traga um exemplo prático com números ilustrativos.

          ## Resumo

          Feche com os pontos principais e convide para o [teste de 1 minuto](/#simulador).

      - label: "6. Imagem de capa (opcional)"
        name: cover
        widget: image
        required: false
        choose_url: false
        hint: "Se ficar vazio, o site usa a capa automática da categoria. De preferência 1200x630 px, com nome de arquivo descritivo (ex.: consorcio-caminhao-autonomo.jpg)."

      - label: "Descrição da imagem (opcional)"
        name: cover_alt
        widget: string
        required: false
        hint: "Descreva a imagem em poucas palavras. Ajuda no Google e na acessibilidade."

      - label: "7. Perguntas frequentes"
        name: faq
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.q}}"
        label_singular: "pergunta"
        hint: "De 3 a 5 perguntas que as pessoas fazem sobre o tema. Elas podem aparecer direto no Google."
        fields:
          - { label: "Pergunta", name: q, widget: string }
          - { label: "Resposta", name: a, widget: text }

      - label: "8. Título para o Google (opcional)"
        name: seo_title
        widget: contador
        required: false
        max: 70
        hint: "Só preencha se o título do artigo for longo. Até 70 caracteres, com a palavra-chave no começo."

      - label: "9. Data de publicação"
        name: date
        widget: datetime
        default: "{{now}}"
        date_format: "DD/MM/YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        hint: "Para agendar, escolha a data e o horário abaixo e publique normalmente. A matéria fica escondida e entra no site sozinha no dia e na hora escolhidos."

      - label: "9b. Horário de publicação (opcional)"
        name: hora
        widget: select
        required: false
        hint: "Horário de Brasília. Deixe vazio para publicar assim que salvar. A matéria entra no ar em até uns 15 minutos depois do horário."
        options: ["00:00", "00:15", "00:30", "00:45", "01:00", "01:15", "01:30", "01:45", "02:00", "02:15", "02:30", "02:45", "03:00", "03:15", "03:30", "03:45", "04:00", "04:15", "04:30", "04:45", "05:00", "05:15", "05:30", "05:45", "06:00", "06:15", "06:30", "06:45", "07:00", "07:15", "07:30", "07:45", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "09:45", "10:00", "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45", "12:00", "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45", "14:00", "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45", "16:00", "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:45", "20:00", "20:15", "20:30", "20:45", "21:00", "21:15", "21:30", "21:45", "22:00", "22:15", "22:30", "22:45", "23:00", "23:15", "23:30", "23:45"]

      - label: "10. Guardar como rascunho (não aparece no site)"
        name: draft
        widget: boolean
        default: true
        hint: "Ligado: só você vê. Desligue quando quiser que o artigo apareça no site."
