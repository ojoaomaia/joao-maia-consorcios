# Publica matérias agendadas. A cada 15 minutos confere se alguma matéria já chegou
# no dia e horário escolhidos (horário de Brasília) e ainda não está no ar.
# Se tiver, faz um commit vazio para a Netlify atualizar o site (veja src/lib/publicados.ts).
# O GitHub às vezes atrasa rotinas agendadas em alguns minutos.
name: Publicar matérias agendadas
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-agendadas
  cancel-in-progress: false
env:
  # Se o site mudar para domínio próprio, este endereço redireciona para ele.
  SITE: https://joaomaiaconsorcios.netlify.app
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Procura matérias agendadas que já deveriam estar no ar
        id: busca
        run: |
          node -e '
            const fs = require("fs");
            const agora = Date.now(), umDia = 24 * 60 * 60 * 1000, conferir = [], liberadas = [];
            for (const f of fs.readdirSync("src/content/blog").filter((x) => x.endsWith(".md"))) {
              const caminho = "src/content/blog/" + f, txt = fs.readFileSync(caminho, "utf8");
              const fm = (txt.match(/^---\n([\s\S]*?)\n---/) || [])[1] || "";
              const campo = (k) => ((fm.match(new RegExp("^" + k + ":[ \\t]*[\"\x27]?([^\"\x27\\n]*)", "m")) || [])[1] || "").trim();
              if (campo("draft") === "true") continue;
              const dia = campo("date").slice(0, 10), hora = campo("hora") || "00:00";
              if (!/^\d{4}-\d{2}-\d{2}$/.test(dia)) continue;
              const quando = new Date(dia + "T" + hora + ":00-03:00").getTime();
              if (quando > agora) continue;
              const slug = f.replace(/\.md$/, "");
              if (campo("agendada") === "true") {
                /* chegou a hora: tira a marca "agendada" (o painel deixa de mostrar no filtro de agendadas) */
                fs.writeFileSync(caminho, txt.replace(/^agendada:[^\n]*\n/m, ""));
                liberadas.push(slug);
              } else if (agora - quando < umDia) conferir.push(slug);
            }
            fs.writeFileSync("conferir.txt", conferir.join("\n"));
            fs.writeFileSync("liberadas.txt", liberadas.join(" "));
          '
          PUBLICAR="$(cat liberadas.txt)"
          for slug in $(cat conferir.txt); do
            CODIGO=$(curl -sL -o /dev/null -w '%{http_code}' "$SITE/blog/$slug/")
            RECENTE=$(git log --since="60 minutes ago" --grep="$slug" --format=%h | head -1)
            echo "$slug: site respondeu $CODIGO${RECENTE:+, já houve tentativa recente ($RECENTE)}"
            if [ "$CODIGO" = "404" ] && [ -z "$RECENTE" ]; then PUBLICAR="$PUBLICAR $slug"; fi
          done
          rm -f conferir.txt liberadas.txt
          echo "materias=$PUBLICAR" >> "$GITHUB_OUTPUT"
          echo "Para publicar agora:${PUBLICAR:- nenhuma}"
      - name: Atualiza o site
        if: steps.busca.outputs.materias != ''
        run: |
          git config user.name "João Maia"
          git config user.email "ojoaomaia@users.noreply.github.com"
          git add src/content/blog
          git commit --allow-empty -m "Publica matérias agendadas: ${{ steps.busca.outputs.materias }}"
          git push
