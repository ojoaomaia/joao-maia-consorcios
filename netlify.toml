[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# links antigos do filtro do blog (/blog/?categoria=imovel) vão para a página da categoria
[[redirects]]
  from = "/blog/"
  to = "/blog/categoria/:c/"
  status = 301
  force = true
  query = { categoria = ":c" }
